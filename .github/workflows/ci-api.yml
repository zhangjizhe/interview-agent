name: Product verification

'on':
  push:
    branches: [main, agent-lab]
    paths: ['apps/api/**', 'apps/web/**', 'apps/agent-lab/**', 'packages/**', 'patches/**', 'scripts/db/**', 'scripts/ci/**', 'docker-compose.yml', 'deploy.sh', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'eslint.config.mjs', '.github/workflows/ci-api.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Production audit and reviewed patch integrity
        run: node scripts/ci/security-audit.mjs
      - name: Lint (fail closed)
        run: pnpm lint --max-warnings 0
      - name: Typecheck all product applications
        run: pnpm typecheck
      - name: API and real Redis tests (offline model fixtures)
        env:
          ANSWER_CACHE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pnpm --filter api test:jest --runInBand
      - name: Cache tests
        run: |
          pnpm --filter api test:unit
          node --test scripts/ci/cache-retention.test.mjs
      - name: Interview and Lab component tests
        run: pnpm --filter web test
      - name: Offline question transfer preview checks
        run: node --test scripts/question-bank-transfer-*.test.mjs
      - name: Golden Dataset contract
        run: pnpm --filter api eval:validate
      - name: PostgreSQL fresh install and legacy upgrade
        run: bash scripts/db/verify-phase2.sh
      - name: Build all product applications
        run: pnpm build

  docker-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API and both frontends from locked source
        run: |
          docker build -f apps/api/Dockerfile -t interview-api:verification .
          docker build -f apps/web/Dockerfile -t interview-web:verification .
          docker build -f apps/agent-lab/Dockerfile -t interview-lab:verification .
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install browser acceptance dependencies
        run: |
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
          pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify isolated question transfer storage (no external models)
        run: bash scripts/ci/verify-question-transfer-storage.sh interview-api:verification
      - name: Verify isolated API, browser and recovery
        env:
          FIXTURE_BROWSER_TEST: '1'
          FIXTURE_LAB_IMAGE: interview-lab:verification
        run: bash scripts/ci/verify-built-api.sh interview-api:verification

  ci-summary:
    runs-on: ubuntu-latest
    needs: [lint-type-test, docker-build-test]
    if: always()
    steps:
      - name: Require all verification jobs
        env:
          TEST_RESULT: ${{ needs.lint-type-test.result }}
          BUILD_RESULT: ${{ needs.docker-build-test.result }}
        run: |
          printf '| Verification | Result |\n| --- | --- |\n| Tests and migrations | %s |\n| Docker builds | %s |\n' "$TEST_RESULT" "$BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
